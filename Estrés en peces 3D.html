<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Estrés en peces 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escena 3D a sangre (izquierda) + panel-infografía de lectura (derecha); en móvil se apilan. */
:root{
  --bg:#E9F0EF; --panel:#F7FAF9; --fg:#12302F; --muted:#4D6A69; --line:#C6D6D3;
  --accent:#0F7C6C; --amber:#B06A0C; --coral:#B83A30; --plum:#7E3570; --water:#2B7598;
  --stage1:#F3F8F7; --stage2:#D3E3E0;
  --f-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1A1C; --panel:#0F2326; --fg:#DCEBE8; --muted:#8FAEAB; --line:#244140;
  --accent:#3CC4A8; --amber:#F0A93A; --coral:#F07468; --plum:#CF86BE; --water:#6FB9DA;
  --stage1:#123236; --stage2:#071315; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1A1C; --panel:#0F2326; --fg:#DCEBE8; --muted:#8FAEAB; --line:#244140;
  --accent:#3CC4A8; --amber:#F0A93A; --coral:#F07468; --plum:#CF86BE; --water:#6FB9DA;
  --stage1:#123236; --stage2:#071315; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden;
  background:radial-gradient(120% 90% at 40% 35%, var(--stage1), var(--stage2))}
.stage canvas.gl,.labels{position:absolute;inset:0;width:100%!important;height:100%!important}
.labels{z-index:2;touch-action:none;cursor:grab}
.labels:active{cursor:grabbing}
.hud{position:absolute;z-index:3;top:0;left:0;right:0;pointer-events:none;
  padding-top:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,30px);line-height:1.05;margin:4px 0 0;text-wrap:balance;max-width:16ch}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.nav{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;
  padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));padding-top:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:linear-gradient(to top, color-mix(in srgb, var(--stage2) 85%, transparent), transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-block:2px}
.chip{flex:none;border:1px solid var(--line);background:color-mix(in srgb, var(--panel) 80%, transparent);color:var(--fg);
  border-radius:999px;padding:6px 11px;font:500 12px var(--f-body);cursor:pointer;display:flex;gap:7px;align-items:baseline}
.chip .n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.chip[aria-current="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.chip[aria-current="true"] .n{color:color-mix(in srgb, var(--panel) 70%, transparent)}
.ibtn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:17px;cursor:pointer;line-height:1}
.tour{flex:none;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:999px;padding:7px 12px;font:600 12px var(--f-body);cursor:pointer}
.tour[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* etiquetas 3D */
.lw{pointer-events:none}
.lw.r,.lw.l{width:0;height:0;position:relative}
.lw.r>.lbl{position:absolute;left:8px;top:0;transform:translateY(-50%)}
.lw.l>.lbl{position:absolute;right:8px;top:0;transform:translateY(-50%)}
.lbl{font:500 11.5px/1.25 var(--f-body);color:var(--fg);white-space:nowrap;
  background:color-mix(in srgb, var(--panel) 84%, transparent);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.lbl b{font-weight:600}
.lbl.sm{font-size:10.5px;padding:2px 6px}
.lbl.eu{border-left:3px solid var(--accent)} .lbl.am{border-left:3px solid var(--amber)}
.lbl.co{border-left:3px solid var(--coral)} .lbl.pl{border-left:3px solid var(--plum)} .lbl.wa{border-left:3px solid var(--water)}
.lbl.ax{background:none;border:0;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lbl.ttl{background:none;border:0;font:700 15px var(--f-display);letter-spacing:.01em}
.lbl.q{border-color:var(--plum);color:var(--plum);font-weight:600}
.lw.dn{width:0;height:0;position:relative}
.lw.dn>.lbl{position:absolute;top:4px;left:0;transform:translateX(-50%)}
.lbl.vert{writing-mode:vertical-rl;background:none;border:0;font-size:10.5px;color:var(--muted);padding:0}
.lbl.vert.on{color:var(--fg);font-weight:600}

/* panel */
.panel{overflow-y:auto;min-width:0;border-left:1px solid var(--line);background:var(--panel);
  padding-block:22px 34px;padding-left:24px;padding-right:max(20px, env(safe-area-inset-right, 0px))}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.08;margin:6px 0 10px;text-wrap:balance}
.panel h3{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.panel p{font-size:14.5px;line-height:1.55;margin:0 0 10px;max-width:62ch}
.lede{font-size:15.5px!important;color:var(--fg)}
.quote{border-left:3px solid var(--accent);padding:8px 12px;margin:12px 0;background:color-mix(in srgb, var(--accent) 7%, transparent);font-size:14px;line-height:1.5}
.quote cite{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:4px;font-style:normal}
.ctrl{display:grid;gap:12px;margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.row label{font-size:13px;font-weight:500}
.row output{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.row small{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--panel);border-radius:6px;padding:8px 12px;font:600 12.5px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 9px;font:500 12px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--panel));font-weight:600}
.status{border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.45;border:1px solid var(--line);background:var(--bg)}
.status b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:2px}
.status.eu{border-color:var(--accent)} .status.am{border-color:var(--amber)} .status.co{border-color:var(--coral)} .status.pl{border-color:var(--plum)}
.steps{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px}
.steps li{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps li.on{color:var(--panel);background:var(--fg);border-color:var(--fg)}
.steps li .t{font-family:var(--f-mono);font-size:10.5px;opacity:.8;margin-left:4px}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13.5px;line-height:1.45}
.facts li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:6px;background:var(--c,var(--accent))}
.facts .ref{color:var(--muted);font-size:12px}
.eq{font-family:var(--f-mono);font-size:12px;line-height:1.7;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow-x:auto}
.eq .v{color:var(--accent);font-weight:500}
.eq .neg{color:var(--plum);font-weight:500}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .fl{height:100%;border-radius:5px;background:var(--c,var(--accent));transition:width .25s}
.bar .vv{font:500 11.5px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res span{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.res i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;margin:6px 0}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.tab{display:grid;gap:4px}
.tab .tr2{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:7px 8px;border-radius:6px;font-size:12.5px;line-height:1.4;cursor:pointer;border:1px solid transparent}
.tab .tr2:hover{background:var(--bg)}
.tab .tr2.on{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--panel))}
.tab .s{font-weight:600}
.tab .cl{color:var(--muted)}
.tab .ct{color:var(--fg)}
.tab .new{color:var(--accent);font-weight:600}
.unk{counter-reset:u;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.unk li{font-size:13.5px;line-height:1.45;padding-left:28px;position:relative}
.unk li::before{content:"?";position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--plum);color:var(--plum);font:700 11px/16px var(--f-mono);text-align:center}
.foot{margin-top:26px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

@media (max-width: 860px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .hint{display:none}
  .bar{grid-template-columns:120px 1fr 36px}
  .lbl{font-size:10px;padding:2px 5px}.lbl.sm{font-size:9.5px}
}
@media (prefers-reduced-motion: reduce){ .bar .fl{transition:none} }
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="Escena 3D interactiva">
    <header class="hud">
      <div class="eyebrow">Schreck &amp; Tort (2016) · Fish Physiology 35 · Cap. 1</div>
      <h1>El concepto de estrés en peces</h1>
      <div class="hint">Arrastra para girar · rueda o pellizco para acercar</div>
    </header>
    <nav class="nav" aria-label="Escenas">
      <button class="ibtn" id="prev" aria-label="Escena anterior">‹</button>
      <div class="chips" id="chips"></div>
      <button class="ibtn" id="next" aria-label="Escena siguiente">›</button>
      <button class="tour" id="tour" aria-pressed="false">Recorrido</button>
    </nav>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function(){
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const panel = document.getElementById('panel');

/* ---------- motor ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.domElement.className = 'gl';
stage.prepend(renderer.domElement);
const labelR = new THREE.CSS2DRenderer();
labelR.domElement.className = 'labels';
renderer.domElement.after(labelR.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
camera.position.set(0, 5, 12);
const controls = new THREE.OrbitControls(camera, labelR.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 45;
scene.add(new THREE.HemisphereLight(0xffffff, 0x2f5552, 0.85));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(6, 11, 8); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x9fd4ff, 0.35); dl2.position.set(-7, 3, -6); scene.add(dl2);

const COL = {cat:0xD2493F, cort:0xE39A2D, eu:0x1FA58B, dis:0x9A4A8A, water:0x3E93B8, crh:0x8A73D6,
             acth:0x4C7FD6, neutral:0x8FA3A6, fish:0x6FA9B5, light:0xBFD3D0, spark:0xF4D35E};

/* tema */
const inkMats = [];
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function applyTheme(){ let c; try{ c = new THREE.Color(tok('--fg') || '#12302F'); }catch(e){ c = new THREE.Color(0x12302F); } inkMats.forEach(m => m.color.copy(c)); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
function inkLine(op=1){ const m = new THREE.LineBasicMaterial({color:0x12302F, transparent:true, opacity:op}); inkMats.push(m); return m; }
function inkBasic(op=1){ const m = new THREE.MeshBasicMaterial({color:0x12302F, transparent:true, opacity:op}); inkMats.push(m); return m; }

/* utilidades */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const sstep = (a,b,x) => { const t = clamp((x-a)/(b-a)); return t*t*(3-2*t); };
const lerp = (a,b,t) => a + (b-a)*t;
const bump = (a,b,x) => sstep(a, a+0.25, x) * (1 - sstep(b-0.35, b, x));
function std(color, o={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.5, metalness:0.05}, o)); }
function sphere(r, color, o){ return new THREE.Mesh(new THREE.SphereGeometry(r, 28, 18), std(color, o)); }
function polyline(pts, mat){ return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat); }
function lbl(html, cls='', pos, anchor){
  const w = document.createElement('div'); w.className = 'lw' + (anchor ? ' '+anchor : '');
  const d = document.createElement('div'); d.className = 'lbl ' + cls; d.innerHTML = html; w.appendChild(d);
  const o = new THREE.CSS2DObject(w); if (pos) o.position.set(pos[0], pos[1], pos[2]); o.inner = d; return o;
}
function arrowObj(len, color, r=0.07){
  const a = new THREE.Group(); const m = std(color, {emissive:color, emissiveIntensity:0.25});
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len*0.75, 12), m); c.rotation.z = -Math.PI/2; c.position.x = len*0.375;
  const h = new THREE.Mesh(new THREE.ConeGeometry(r*2.6, len*0.25, 16), m); h.rotation.z = -Math.PI/2; h.position.x = len*0.875;
  a.add(c, h); return a;
}
const tmpC = new THREE.Color(), cA = new THREE.Color(), cB = new THREE.Color();
function mix3(hexes, t){ // gradiente por tramos
  t = clamp(t); const n = hexes.length - 1; const i = Math.min(n-1, Math.floor(t*n)); const f = t*n - i;
  return tmpC.copy(cA.setHex(hexes[i])).lerp(cB.setHex(hexes[i+1]), f);
}

/* pez estilizado (cabeza hacia +x) */
function makeFish(op=0.2){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:COL.fish, transparent:true, opacity:op, roughness:0.35, depthWrite:false, side:THREE.DoubleSide});
  const geo = new THREE.SphereGeometry(1, 48, 32);
  const body = new THREE.Mesh(geo, mat); body.scale.set(3, 1.25, 0.72); g.add(body);
  const wf = new THREE.Mesh(geo, inkBasic(0.06)); wf.material.wireframe = true; wf.scale.copy(body.scale); g.add(wf);
  const finMat = new THREE.MeshStandardMaterial({color:COL.fish, transparent:true, opacity:op+0.12, side:THREE.DoubleSide, depthWrite:false});
  const ts = new THREE.Shape(); ts.moveTo(0,0); ts.lineTo(-1.5,1.15); ts.quadraticCurveTo(-1.05,0,-1.5,-1.15); ts.lineTo(0,0);
  const tail = new THREE.Mesh(new THREE.ShapeGeometry(ts), finMat); const tailPivot = new THREE.Group(); tailPivot.position.x = -2.75; tailPivot.add(tail); g.add(tailPivot);
  const ds = new THREE.Shape(); ds.moveTo(-1.6,0); ds.quadraticCurveTo(-0.6,1.05,1.0,0); ds.lineTo(-1.6,0);
  const dorsal = new THREE.Mesh(new THREE.ShapeGeometry(ds), finMat); dorsal.position.y = 1.08; g.add(dorsal);
  const as = new THREE.Shape(); as.moveTo(-1.5,0); as.quadraticCurveTo(-0.9,-0.6,-0.2,0); as.lineTo(-1.5,0);
  const anal = new THREE.Mesh(new THREE.ShapeGeometry(as), finMat); anal.position.y = -1.0; g.add(anal);
  const eyeM = std(0x1d2b2b, {roughness:0.2});
  [-1,1].forEach(s => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), eyeM); e.position.set(2.42, 0.36, 0.46*s); g.add(e); });
  return {group:g, tail:tailPivot, mat};
}

/* flujo continuo de partículas a lo largo de una curva */
function stream(curve, color, n, speed, size=0.06){
  const g = new THREE.Group(); const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.95});
  const geo = new THREE.SphereGeometry(size, 10, 8); const ps = [];
  for (let i=0;i<n;i++){ const m = new THREE.Mesh(geo, mat); g.add(m); ps.push({m, t:i/n}); }
  return {g, update(dt){ ps.forEach(p => { p.t = (p.t + speed*dt) % 1; curve.getPointAt(p.t, p.m.position); }); }};
}
function curve3(a, b, lift){ const m = a.clone().lerp(b, 0.5).add(lift || V(0,0.6,0)); return new THREE.CatmullRomCurve3([a.clone(), m, b.clone()]); }

/* ================= ESCENAS ================= */
const S = [];

/* 1 · Estresor, estrés y homeostasis */
S.push({
  sec:'1.1.1 · 1.1.3', nav:'Estrés y homeostasis', cam:[0,4.6,8.4], tgt:[0,0.9,0],
  init(g){
    this.st = {x:0, v:0, eq:0, peak:0, acc:0, since:0, status:'rest', last:'', out:false, outT:0, vy:0, hit:-1, applied:false, sev:0.5};
    const pts = []; for (let i=0;i<=40;i++){ const r = i/40*3; pts.push(new THREE.Vector2(r, 0.22*r*r)); }
    const geo = new THREE.LatheGeometry(pts, 72);
    g.add(new THREE.Mesh(geo, std(COL.water, {transparent:true, opacity:0.26, side:THREE.DoubleSide, depthWrite:false})));
    const wf = new THREE.Mesh(geo, inkBasic(0.07)); wf.material.wireframe = true; g.add(wf);
    const ring = (r, color, tube=0.03) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 120), new THREE.MeshBasicMaterial({color})); m.rotation.x = Math.PI/2; m.position.y = 0.22*r*r + 0.01; g.add(m); };
    ring(0.9, COL.eu); ring(2.0, COL.cort); ring(3.0, COL.dis, 0.045);
    const a = 0.72;
    g.add(lbl('Rango homeostático', 'eu sm', [-0.9*a, 0.22*0.81+0.05, 0.9*a]));

function respF(t, s, mode, pat){

    const dt = t - 1;
    if (mode === 'phys'){ if (dt <= 0) return R0; let amp = (0.5 + 2.3*s)*(1 - Math.exp(-dt/0.5));
      if (s < 0.5) amp *= lerp(1, 0.3 + 1.4*s, sstep(1.5, 6, dt));
      if (s > 0.82) amp *= 1 - 0.85*sstep(3, 7, dt)*((s-0.82)/0.18);
      return R0 + amp; }

    if (s < 0.3) P = R - 0.5*s*Math.exp(-dt/1.2) + 0.4*(1 - s/0.3)*sstep(0.5, 4, dt);
    else { P = R - (0.3 + 1.3*(s-0.3))*sstep(0, 2.5, dt); if (s < 0.5) P += (0.5-s)/0.2*0.25*sstep(2, 7, dt); }
    if (s > 0.8) P = lerp(P, 0, sstep(2.5, 7.5, dt)*((s-0.8)/0.2));
    return Math.max(0, P);
  }
  const times = pat === 'A' ? [1] : pat === 'B' ? [1, 1.7, 2.4] : [1, 4, 7];
  const tau = 0.55 + 1.0*s; const g = d => d <= 0 ? 0 : (d/tau)*Math.exp(1 - d/tau);
  const last = times[times.length-1];

    let y = R0; times.forEach((ti,k) => { y += (0.5 + 2.2*s)*(pat === 'C' ? Math.pow(0.72, k) : 1)*g(t - ti); });
    return y;
  }
  let P = R;
  times.forEach((ti,k) => { P -= 1.5*s*(pat === 'C' ? Math.pow(0.7, k) : 1)*g(t - ti);
    if (s < 0.35 && !(pat === 'B' && k > 0)) P += (pat === 'C' ? 0.22 : 0.4)*(1 - s/0.35)*sstep(ti + tau, ti + 3*tau, t); });

  return Math.max(0, P);
}

    const bm = sphere(0.24, 0xB9A7D9, {emissive:0xB9A7D9, emissiveIntensity:0.4}); bm.position.copy(brain); g.add(bm);
    bm.add(lbl('Hipotálamo', 'sm pl', [0.3, 0.55, 0]));
    const im = sphere(0.16, COL.cort, {emissive:COL.cort, emissiveIntensity:0.4}); im.position.copy(ir); g.add(im);
    im.add(lbl('Eje HPI → cortisol', 'sm am', [-0.6, -0.5, 0]));
    this.bm = bm; this.im = im;
    this.groups = {classic:new THREE.Group(), non:new THREE.Group()}; g.add(this.groups.classic, this.groups.non);
    this.streams = [];
    const addStream = (grp, c, color, n, sp, sz) => { const st = stream(c, color, n, sp, sz); grp.add(st.g); this.streams.push(st);
      grp.add(polyline(c.getPoints(30), new THREE.LineBasicMaterial({color, transparent:true, opacity:0.3}))); };
    const classic = [['Visión', V(6.5,2.6,3.2), V(2.42,0.38,0.5)], ['Audición', V(5.2,3.6,-3), V(1.9,0.35,-0.35)], ['Tacto', V(3.6,-3,3.6), V(2.1,-0.45,0.55)], ['Olfato', V(7.4,0.6,-1.2), V(2.85,0.22,-0.18)], ['Gusto', V(6.8,-1.9,1.2), V(2.95,-0.15,0.1)]];
    const sg = new THREE.OctahedronGeometry(0.22);
    classic.forEach(([n, src, tgt]) => { const m = new THREE.Mesh(sg, std(COL.water, {emissive:COL.water, emissiveIntensity:0.3})); m.position.copy(src); this.groups.classic.add(m);
      m.add(lbl(n, 'wa sm', [0, 0.45, 0]));
      addStream(this.groups.classic, curve3(src, tgt, V(0, 0.5, 0)), COL.water, 9, 0.35, 0.055);
      addStream(this.groups.classic, curve3(tgt, brain, V(0, 0.15, 0)), COL.spark, 4, 0.9, 0.045); });
    const sites = {gill:V(1.4,-0.05,0.62), gill2:V(1.35,-0.05,-0.62), skin:V(-0.6,0.25,0.7), skin2:V(-1.1,-0.3,-0.68), gut:V(0.2,-0.45,0)};
    this.siteMeshes = [];
    const siteL = {gill:'Branquias', skin:'Piel', gut:'Intestino'};
    Object.entries(sites).forEach(([k, p]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 12), new THREE.MeshBasicMaterial({color:COL.cat, transparent:true, opacity:0.5, depthWrite:false})); m.position.copy(p); this.groups.non.add(m); this.siteMeshes.push(m);
      if (siteL[k]) m.add(lbl(siteL[k] + ' · respuesta local', 'co sm', [0, -0.45, 0]));
      addStream(this.groups.non, curve3(p, brain, V(0, 0.9, 0)), COL.crh, 5, 0.22, 0.05); });
    const non = [['Acidez (pH)', V(-3,3.8,3.2), sites.gill], ['Hipoxia', V(-0.8,4.4,-3.2), sites.gill2], ['Hipercapnia (CO₂)', V(-5.2,2.2,-2.4), sites.gill2], ['Osmoestrés', V(-6.2,-0.8,3.2), sites.skin], ['Patógenos y parásitos', V(-4.4,-3.6,-2.6), sites.skin2], ['Dieta deficiente', V(-0.4,-4.4,2.8), sites.gut], ['Contaminantes', V(2.4,-4.2,-3.4), sites.gill2]];
    non.forEach(([n, src, tgt]) => { const m = new THREE.Mesh(sg, std(COL.cat, {emissive:COL.cat, emissiveIntensity:0.25})); m.position.copy(src); this.groups.non.add(m);
      m.add(lbl(n, 'co sm', [0, 0.45, 0]));
      addStream(this.groups.non, curve3(src, tgt, V(0, 0.4, 0)), COL.cat, 9, 0.3, 0.055); });
    const hpi = stream(curve3(brain, ir, V(0, 0.25, 0.1)), COL.cort, 6, 0.5, 0.05); g.add(hpi.g); this.streams.push(hpi);
  },
  setMode(m){ this.mode = m; this.groups.classic.visible = m !== 'non'; this.groups.non.visible = m !== 'classic';
    [this.groups.classic, this.groups.non].forEach(gr => gr.traverse(o => { if (o.isCSS2DObject){ o.visible = gr.visible; if (!gr.visible) o.element.style.display = 'none'; } }));
    panel.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === m)); },
  update(dt, t){ this.streams.forEach(s => s.update(dt)); this.f.tail.rotation.y = Math.sin(t*3)*0.25;
    this.siteMeshes.forEach((m,i) => { const k = 1 + 0.25*Math.sin(t*3 + i); m.scale.setScalar(k); });
    this.bm.material.emissiveIntensity = 0.4 + 0.3*Math.sin(t*4); },
  panel(){ return `
    <div class="sec">Sección 1.4 · Sistemas sensoriales y percepción</div>
    <h2>Por dónde entra la amenaza</h2>
    <p class="lede">La respuesta clásica solo se inicia si el pez percibe una amenaza. Los sentidos clásicos no son la única vía.</p>
    <div class="ctrl"><div class="seg" role="group" aria-label="Vías">
      <button data-v="classic">Sentidos clásicos</button><button data-v="non">Rutas no clásicas</button><button data-v="both">Ambas</button></div></div>
    <div class="legend"><span style="--c:#3E93B8"><i></i>Estímulo sensorial</span><span style="--c:#F4D35E"><i></i>Señal nerviosa</span><span style="--c:#D2493F"><i></i>Estresor en mucosas</span><span style="--c:#8A73D6"><i></i>Citocinas hacia el cerebro</span><span style="--c:#E39A2D"><i></i>Eje HPI</span></div>
    <h3>Dos caminos al eje HPI</h3>
    <ul class="facts">
      <li style="--c:var(--water)"><span><b>Sentidos clásicos.</b> Visión, audición, tacto, olfato y probablemente gusto activan la respuesta neuroendocrina en el hipotálamo. Lo que causa miedo, incomodidad o dolor provoca respuesta <span class="ref">(Schreck 1981)</span>.</span></li>
      <li style="--c:var(--coral)"><span><b>Rutas no clásicas.</b> Acidez, hipoxia, hipercapnia, osmoestrés y patógenos elevan el cortisol por vías nerviosas que no son los sentidos clásicos.</span></li>
      <li style="--c:var(--plum)"><span><b>Mucosas.</b> En branquias, piel e intestino la respuesta empieza siendo local (expresión de citocinas) y luego se vuelve sistémica al activar el eje HPI. Una dieta deficiente puede actuar así como estresor crónico.</span></li>
      <li style="--c:var(--amber)"><span>El momento en que un patógeno activa el eje HPI depende de su virulencia y de la intensidad de la infección.</span></li>
    </ul>`; },
  bind(){ panel.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => this.setMode(b.dataset.v))); this.setMode(this.mode); }
});

/* 9 · Clásico vs contemporáneo (Tabla 1.1) e incógnitas */
const TAB = [
 ['Respuesta conductual',['Especie-específica'],['Especie-específica','Estrategia de afrontamiento']],
 ['Jerarquía biológica',['Organísmica'],['Organísmica','Celular','Molecular']],
 ['Respuesta endocrina',['Jerárquica (hipotálamo, hipófisis, interrenal)'],['No jerárquica (múltiples direcciones)']],
 ['Aprendizaje y adaptación',['Estereotipada'],['Aprendizaje y adaptación']],
 ['Regulación fisiológica',['Sistema nervioso','Sistema endocrino'],['Sistema nervioso','Sistema endocrino','Sistema inmune']],
 ['Regulación',['Homeostasis'],['Homeostasis','Alostasis']],
 ['Dinámica de respuesta',['Unimodal'],['Unimodal','Bimodal']],
 ['Variables de respuesta',['Fisiológicas','Metabólicas'],['Fisiológicas','Metabólicas','Energética / asignación de recursos']],
 ['Detección',['Central (sistema nervioso)'],['Múltiple (central y periférica)']],
 ['Señalización',['Hormonas'],['Hormonas','Citocinas']],
 ['Efectos del estrés',['Organísmicos','Fisiológicos'],['Organísmicos','Fisiológicos','Dolor','Psicológicos']],
 ['Efectos del estresor',['Distrés'],['Distrés','Eustrés']],
 ['Rasgos del estresor',['Naturaleza','Intensidad','Duración'],['Naturaleza','Intensidad','Duración','Control','Predictibilidad']],
 ['Variación',['Interespecífica'],['Interespecífica','Individual']]];
S.push({
  sec:'1.5 · 1.6 · Tabla 1.1', nav:'Paradigmas e incógnitas', cam:[0,6.5,16], tgt:[0,1.8,0],
  init(g){
    this.sel = -1; this.cols = []; this.vl = [];
    const cm = COL.neutral, nm = COL.eu;
    TAB.forEach((r, i) => { const x = -7.8 + i*1.2, z = -0.05*x*x;
      const mk = (n, dx, color) => { const h = n*0.75; const m = new THREE.Mesh(new THREE.BoxGeometry(0.42, h, 0.42), std(color, {emissive:color, emissiveIntensity:0})); m.position.set(x+dx, h/2, z); m.userData.i = i; g.add(m); this.cols.push(m); return m; };
      mk(r[1].length, -0.24, cm); mk(r[2].length, 0.24, nm);
      const L = lbl(r[0], 'vert', [x, -0.05, z], 'dn'); g.add(L); this.vl.push(L); });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(19, 5), inkBasic(0.05)); floor.rotation.x = -Math.PI/2; floor.position.set(0, -0.01, -1.2); g.add(floor);
    g.add(lbl('Altura = número de elementos considerados en la tabla', 'ax', [0, 4.0, 1]));
    const Q = ['¿Dónde está el punto de inflexión eustrés / distrés?','¿Control gradual o por umbral?','¿Cuándo se ha recuperado el pez?','¿Responden igual los peces silvestres?','¿Distintos sentidos, misma respuesta?','¿Un «recetario» validado para interpretar?'];
    this.qs = Q.map((q, i) => { const a = -1.1 + i*0.44; const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), std(COL.dis, {emissive:COL.dis, emissiveIntensity:0.35, flatShading:true}));
      m.position.set(Math.sin(a)*9.5, 5.0 + (i%2)*0.8, -3.5 - Math.cos(a)*1.5); g.add(m); m.add(lbl(q, 'q sm', [0, 0.42, 0])); m.base = m.position.y; return m; });
  },
  select(i){ this.sel = i; this.cols.forEach(m => m.material.emissiveIntensity = m.userData.i === i ? 0.55 : 0);
    this.vl.forEach((l, k) => l.inner.classList.toggle('on', k === i));
    panel.querySelectorAll('.tr2').forEach((el, k) => el.classList.toggle('on', k === i));
    const el = panel.querySelector('.tr2.on'); if (el) el.scrollIntoView({block:'nearest', behavior: reduce ? 'auto' : 'smooth'}); },
  pick(ray){ const h = ray.intersectObjects(this.cols); if (h.length) this.select(h[0].object.userData.i); },
  update(dt, t){ this.qs.forEach((m, i) => { m.position.y = m.base + Math.sin(t*1.2 + i)*0.15; m.rotation.y += dt*0.5; });
    if (tour.on){ this.tk = (this.tk||0) + dt; if (this.tk > 1.1){ this.tk = 0; this.select((this.sel + 1) % TAB.length); } } },
  panel(){ return `
    <div class="sec">Secciones 1.5 y 1.6 · Tabla 1.1</div>
    <h2>Del paradigma clásico al contemporáneo</h2>
    <p class="lede">La adaptación es el conjunto de mecanismos que permite superar el estresor: compensación, habituación, energética, respuesta inmune, aprendizaje y estrategia de afrontamiento.</p>
    <p>La no adaptación ocurre cuando faltan recursos para superar el estresor o la reacción no se puede controlar. La <b>incontrolabilidad</b> y la <b>impredecibilidad</b> siempre dificultan el afrontamiento porque aumentan la carga alostática. En acuicultura, la restricción de movimiento y un ambiente regular hacen que el aprendizaje y el endurecimiento difieran de los del pez silvestre.</p>
    <div class="legend"><span style="--c:#8FA3A6"><i></i>Clásico</span><span style="--c:#1FA58B"><i></i>Contemporáneo</span><span style="color:var(--muted)">Toca una columna o una fila</span></div>
    <h3>Tabla 1.1</h3>
    <div class="tab">${TAB.map((r, i) => `<div class="tr2" data-i="${i}"><span class="s">${r[0]}</span><span><span class="cl">${r[1].join(' · ')}</span><br><span class="ct">→ ${r[2].map(x => r[1].includes(x) ? x : `<span class="new">${x}</span>`).join(' · ')}</span></span></div>`).join('')}</div>
    <h3>Incógnitas clave</h3>
    <ul class="unk">
      <li>Predecir que un pez está estresado es relativamente fácil. Saber cuándo se recuperó no: un cortisol normal puede significar recuperación o solo que el pez logró bajarlo.</li>
      <li>¿Dónde está el punto de inflexión entre una elevación adaptativa (eustrés) y una maladaptativa?</li>
      <li>Por encima del eustrés, ¿una respuesta mayor indica un pez más estresado?</li>
      <li>¿La respuesta funciona con control gradual o por umbrales?</li>
      <li>¿Estresores percibidos por distintos sentidos producen respuestas similares?</li>
      <li>Casi no hay datos de peces silvestres. Hay que validar que lo aprendido en cautiverio se aplica a ellos.</li>
      <li>Hace falta un «recetario» validado para interpretar las mediciones de estrés.</li>
    </ul>
    <p class="foot">Fuente: Schreck, C. B. y Tort, L. (2016). The concept of stress in fish. En Schreck, Tort, Farrell y Brauner (eds.), <i>Biology of Stress in Fish</i>, Fish Physiology vol. 35, cap. 1, pp. 1–34. Elsevier.</p>`; },
  bind(){ panel.querySelectorAll('.tr2').forEach(el => el.addEventListener('click', () => this.select(+el.dataset.i))); if (this.sel >= 0) this.select(this.sel); }
});

/* ---------- navegación ---------- */
let cur = -1, camAnim = null;
const tour = {on:false, t:0, dur:18};
const chips = document.getElementById('chips');
S.forEach((s, i) => { const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = `<span class="n">${s.sec.split(' ')[0]}</span>${s.nav}`; b.addEventListener('click', () => { go(i); }); chips.appendChild(b); s.chip = b; });

function go(i){
  i = (i + S.length) % S.length; if (i === cur) return;
  if (cur >= 0){ const o = S[cur]; scene.remove(o.g); o.g.traverse(c => { if (c.isCSS2DObject) c.element.style.display = 'none'; }); }
  cur = i; const s = S[i];
  if (!s.g){ s.g = new THREE.Group(); s.init(s.g); }
  scene.add(s.g); s.g.scale.setScalar(0.9);
  panel.innerHTML = s.panel(); panel.scrollTop = 0; s.bind && s.bind(); s.enter && s.enter();
  const tgt = V(...s.tgt), cp = V(...s.cam); const asp = camera.aspect;
  if (asp < 1.0) cp.sub(tgt).multiplyScalar(asp < 0.75 ? 1.15 : 1.08).add(tgt);
  camAnim = {t:0, p0:camera.position.clone(), p1:cp, q0:controls.target.clone(), q1:tgt};
  S.forEach((x, k) => x.chip.setAttribute('aria-current', k === i));
  s.chip.scrollIntoView({inline:'nearest', block:'nearest'});
  tour.t = 0;
  try { localStorage.setItem('estres3d-escena', String(i)); } catch(e){}
}
document.getElementById('prev').addEventListener('click', () => go(cur - 1));
document.getElementById('next').addEventListener('click', () => go(cur + 1));
const tb = document.getElementById('tour');
tb.addEventListener('click', () => { tour.on = !tour.on; tour.t = 0; tb.setAttribute('aria-pressed', tour.on); tb.textContent = tour.on ? 'Detener recorrido' : 'Recorrido'; });
window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
controls.addEventListener('start', () => { camAnim = null; });

/* selección por clic (escena 9) */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null;
labelR.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
labelR.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const s = S[cur]; if (!s.pick) return; const r = labelR.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); ray.setFromCamera(mouse, camera); s.pick(ray);
});

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); labelR.setSize(w, h);
  camera.aspect = w/h; camera.fov = camera.aspect < 0.9 ? 55 : 42; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

const clock = new THREE.Clock(); let T = 0;
function loop(){
  requestAnimationFrame(loop);
  let dt = Math.min(clock.getDelta(), 0.05); if (reduce) dt *= 0.6; T += dt;
  if (camAnim){ camAnim.t = Math.min(1, camAnim.t + dt/1.3); const e = sstep(0, 1, camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.q0, camAnim.q1, e); if (camAnim.t >= 1) camAnim = null; }
  const s = S[cur];
  if (s){ if (s.g.scale.x < 1) s.g.scale.setScalar(Math.min(1, s.g.scale.x + dt*0.3)); s.update && s.update(dt, T); }
  if (tour.on){ tour.t += dt; if (tour.t > tour.dur) go(cur + 1); }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
}
applyTheme();
let start = 0; try { const v = parseInt(localStorage.getItem('estres3d-escena'), 10); if (v >= 0 && v < S.length) start = v; } catch(e){}
go(start); camera.position.copy(camAnim.p1); controls.target.copy(camAnim.q1); camAnim = null;
loop();
})();
</script>

</body></html>
